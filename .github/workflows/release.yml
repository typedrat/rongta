# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  build:
    needs:
      - version
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish the release
    needs:
      - build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Create release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes artifacts/*
  version:
    name: Check the tag matches the version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' rongta-rs/gui/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match rongta-gui version $version" >&2
            exit 1
          fi
name: Release
"on":
  push:
    tags:
      - v*
permissions:
  contents: read
