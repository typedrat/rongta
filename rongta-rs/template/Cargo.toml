[package]
name = "rongta-template"
version = "0.1.0"
edition = "2024"
description = "Fill-in label templates rendered for Rongta printers"
publish = false

[dependencies]
rongta = { path = ".." }
ab_glyph = "0.2"
anyhow = "1"
image = { version = "0.25", default-features = false }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
rqrr = "0.11"
image = { version = "0.25", default-features = false }
