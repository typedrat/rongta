[package]
name = "rongta"
version = "0.1.1"
edition = "2024"
description = "Portable Rongta R22 printer protocol and image processing"
publish = false

[workspace]
members = ["cli", "host", "template", "gui"]
default-members = [".", "cli", "host", "template", "gui"]
resolver = "3"

[dependencies]
anyhow = "1"
bytes = "1"
crc = "3"
deku = "0.20"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }
proptest = "1"
