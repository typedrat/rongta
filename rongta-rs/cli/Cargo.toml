[package]
name = "rongta-cli"
version = "0.1.0"
edition = "2024"
description = "Bluetooth CLI for Rongta R22 printers on Linux, macOS, and Windows"
publish = false

[[bin]]
name = "rongta"
path = "src/main.rs"

[dependencies]
rongta = { path = ".." }
rongta-host = { path = "../host" }
anyhow = "1"
bytes = "1"
dialoguer = { version = "0.12", default-features = false }
getrandom = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
toml = "0.9"
usage = { package = "usage-rs", version = "6", features = ["test"] }
